<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Time Tracker</h1>
    <p>
      Bem vindo ao Time Tracker! Aqui você terá um maior controle do seu tempo,
      podendo registrar suas atividades e acompanhar o tempo gasto em cada uma
      delas.
    </p>
    <br />
    <button class="btnstart">Start</button><br />
    <button class="btnstop">Stop</button>
    <div class="timer">
      <p>Tempo: 00:00:00</p>
    </div>

    <!-- Olha a lista aqui embaixo! -->
    <h3>Tempos Registrados:</h3>
    <ul>
      <li>Estudo de HTML - 00:45:00</li>
      <li>Pausa pro café - 00:15:00</li>
    </ul>
  </body>
</html>
